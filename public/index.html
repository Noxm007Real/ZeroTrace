<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ZeroTrace - Anti-Trace Gateway</title>
  <style>
    :root {
      --bg: #fdfaf6;
      --card: #ffffff;
      --border: #000000;
      --primary: #8de0b3;
      --secondary: #ffda59;
      --text: #000000;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
    body { background: var(--bg); color: var(--text); display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; padding: 1.5rem; }
    
    .container { 
      background: var(--card); 
      border: 3px solid var(--border); 
      border-radius: 16px; 
      padding: 2.5rem; 
      width: 100%; 
      max-width: 460px; 
      box-shadow: 6px 6px 0px var(--border); 
      text-align: center; 
    }
    
    .badge { 
      display: inline-block; 
      padding: 0.4rem 1rem; 
      background: var(--secondary); 
      border: 2px solid var(--border); 
      box-shadow: 3px 3px 0px var(--border);
      color: var(--text); 
      border-radius: 9999px; 
      font-size: 0.8rem; 
      font-weight: 800; 
      letter-spacing: 0.05em; 
      text-transform: uppercase; 
      margin-bottom: 1.5rem; 
    }
    
    h1 { font-size: 2rem; font-weight: 800; margin-bottom: 0.5rem; letter-spacing: -0.03em; }
    p { font-size: 0.95rem; line-height: 1.5; margin-bottom: 1.75rem; font-weight: 500; }
    
    input { 
      width: 100%; 
      padding: 1rem; 
      background: var(--card); 
      border: 3px solid var(--border); 
      border-radius: 12px; 
      color: var(--text); 
      font-size: 1rem; 
      font-weight: 600;
      outline: none; 
      margin-bottom: 1rem; 
      transition: all 0.2s;
    }
    input:focus { box-shadow: 4px 4px 0px var(--primary); transform: translate(-2px, -2px); }
    
    button { 
      width: 100%; 
      padding: 1rem; 
      background: var(--primary); 
      color: var(--text); 
      border: 3px solid var(--border); 
      border-radius: 12px; 
      box-shadow: 4px 4px 0px var(--border);
      font-size: 1rem; 
      font-weight: 800; 
      cursor: pointer; 
      transition: all 0.1s; 
    }
    button:active { transform: translate(4px, 4px); box-shadow: 0px 0px 0px var(--border); }
    
    .result { display: none; margin-top: 1.5rem; text-align: left; background: var(--card); border: 3px solid var(--border); border-radius: 12px; padding: 1rem; box-shadow: 4px 4px 0px var(--secondary); }
    .result label { font-size: 0.8rem; font-weight: 800; text-transform: uppercase; }
    .result a { color: var(--text); font-weight: 700; word-break: break-all; text-decoration: none; display: block; margin-top: 0.5rem; font-size: 0.95rem; }
    .result a:hover { text-decoration: underline; }
    
    footer { margin-top: 2rem; font-size: 0.85rem; font-weight: 600; }
    footer span { background: var(--primary); padding: 0.1rem 0.4rem; border: 2px solid var(--border); border-radius: 4px; }
  </style>
</head>
<body>
  <div class="container">
    <div class="badge">Zero-Trace Protocol</div>
    <h1>ZeroTrace</h1>
    <p>Sembunyikan URL tujuan asli di balik rantai tantangan enkriptik dinamis tanpa jejak bot.</p>
    
    <input type="url" id="targetUrl" placeholder="https://example.com/file-secret" required />
    <button onclick="createZeroTrace()">Kunci & Terbitkan URL</button>

    <div id="resultBox" class="result">
      <label>Tautan Terproteksi</label>
      <a id="linkResult" href="#" target="_blank"></a>
    </div>
  </div>

  <footer>
    Crafted by <span>noxm007</span>
  </footer>

  <script>
    async function createZeroTrace() {
      const url = document.getElementById('targetUrl').value.trim();
      if (!url) return alert('Harap masukkan URL yang valid!');

      const btn = document.querySelector('button');
      btn.innerText = 'Mengenkripsi...';
      btn.disabled = true;

      try {
        const res = await fetch('/api/create', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ url })
        });
        const data = await res.json();
        if (data.token) {
          const out = `${window.location.origin}/s/${data.token}`;
          const box = document.getElementById('resultBox');
          const link = document.getElementById('linkResult');
          link.href = out;
          link.innerText = out;
          box.style.display = 'block';
        } else {
          alert(data.error || 'Terjadi kesalahan.');
        }
      } catch (err) {
        alert('Gagal terhubung ke API.');
      } finally {
        btn.innerText = 'Kunci & Terbitkan URL';
        btn.disabled = false;
      }
    }
  </script>
</body>
</html>
