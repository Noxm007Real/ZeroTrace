<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Verifikasi Keamanan</title>
  <style>
    /* Definisi Tema CLI */
    body.theme-nord { --bg: #2e3440; --card: #3b4252; --border: #4c566a; --primary: #88c0d0; --secondary: #81a1c1; --text: #eceff4; }
    body.theme-dracula { --bg: #282a36; --card: #44475a; --border: #6272a4; --primary: #ff79c6; --secondary: #50fa7b; --text: #f8f8f2; }
    body.theme-gruvbox { --bg: #282828; --card: #3c3836; --border: #504945; --primary: #b8bb26; --secondary: #fabd2f; --text: #ebdbb2; }
    body.theme-matrix { --bg: #0d0d0d; --card: #1a1a1a; --border: #00ff41; --primary: #00ff41; --secondary: #008f11; --text: #00ff41; }
    body.theme-monokai { --bg: #272822; --card: #3e3d32; --border: #75715e; --primary: #a6e22e; --secondary: #fd971f; --text: #f8f8f2; }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Consolas', 'Courier New', monospace; }
    body { background: var(--bg); color: var(--text); display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; padding: 1.5rem; transition: background 0.3s; }
    
    .card { background: var(--card); border: 3px solid var(--border); border-radius: 16px; padding: 2.5rem; width: 100%; max-width: 400px; box-shadow: 6px 6px 0px var(--border); text-align: center; }
    
    .spinner { border: 4px solid var(--bg); border-top: 4px solid var(--primary); border-radius: 50%; width: 40px; height: 40px; animation: spin 0.8s linear infinite; margin: 1.5rem auto; }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    
    h2 { font-size: 1.5rem; margin-bottom: 0.5rem; font-weight: bold; color: var(--primary); letter-spacing: -0.03em; }
    p { font-size: 0.95rem; font-weight: bold; color: var(--text); opacity: 0.8; }
    
    .slider-track { width: 100%; height: 56px; background: var(--bg); border: 3px solid var(--border); border-radius: 28px; position: relative; overflow: hidden; margin-top: 1.5rem; user-select: none; box-shadow: 4px 4px 0px var(--border) inset; }
    .slider-thumb { width: 50px; height: 50px; background: var(--primary); color: var(--bg); border: 3px solid var(--border); border-radius: 50%; position: absolute; left: 0; top: 0; cursor: grab; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 1.2rem; }
    .slider-thumb:active { cursor: grabbing; background: var(--secondary); }
    
    footer { margin-top: 2rem; font-size: 0.85rem; font-weight: bold; color: var(--secondary); }
    footer span { background: var(--primary); color: var(--bg); padding: 0.1rem 0.4rem; border: 2px solid var(--border); border-radius: 4px; }
  </style>
</head>
<body>

  <!-- Pengacak Tema Saat Halaman Dimuat -->
  <script>
    const themes = ['theme-nord', 'theme-dracula', 'theme-gruvbox', 'theme-matrix', 'theme-monokai'];
    document.body.className = themes[Math.floor(Math.random() * themes.length)];
  </script>

  <div class="card">
    <h2 id="stepTitle">> VERIFIKASI_NODE</h2>
    <p id="stepDesc">Menghubungkan ke perisai jaringan...</p>
    <div id="contentArea"><div class="spinner"></div></div>
  </div>

  <footer>
    Gateway by <span>noxm007</span>
  </footer>

  <script>
    const linkToken = window.location.pathname.split('/').pop();
    let currentSessionToken = null;

    async function init() {
      try {
        const res = await fetch('/api/init', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ linkToken }) });
        const data = await res.json();
        if (data.error) throw new Error(data.error);
        currentSessionToken = data.sessionToken;
        handleStep(data.currentStep, data.stepData);
      } catch (err) {
        document.getElementById('stepTitle').innerText = '> AKSES_DITOLAK';
        document.getElementById('stepDesc').innerText = err.message;
        document.getElementById('contentArea').innerHTML = '';
      }
    }

    async function submitProof(proof) {
      try {
        const res = await fetch('/api/verify', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ sessionToken: currentSessionToken, proof }) });
        const data = await res.json();
        if (data.error) throw new Error(data.error);

        if (data.done) {
          document.getElementById('stepTitle').innerText = '> AKSES_DIBERIKAN';
          document.getElementById('stepDesc').innerText = 'Mengarahkan ke tujuan aman...';
          document.getElementById('contentArea').innerHTML = '<div class="spinner"></div>';
          
          const resolveRes = await fetch('/api/resolve', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ readyToken: data.readyToken }) });
          const resolveData = await resolveRes.json();
          if (resolveData.destination) window.location.href = resolveData.destination;
        } else {
          currentSessionToken = data.sessionToken;
          handleStep(data.nextStep, data.stepData);
        }
      } catch (err) {
        document.getElementById('stepTitle').innerText = '> KESALAHAN_SISTEM';
        document.getElementById('stepDesc').innerText = err.message;
      }
    }

    function handleStep(step, stepData) {
      const title = document.getElementById('stepTitle');
      const desc = document.getElementById('stepDesc');
      const area = document.getElementById('contentArea');

      if (step === 'pow') {
        title.innerText = '> BUKTI_KOMPUTASI';
        desc.innerText = 'Menghitung hash latar belakang...';
        area.innerHTML = '<div class="spinner"></div>';
        setTimeout(async () => {
          const nonce = await solvePoW(stepData.salt, stepData.difficulty);
          submitProof({ nonce });
        }, 80);
      }

      if (step === 'delay') {
        title.innerText = '> SINKRONISASI_BUFFER';
        desc.innerText = 'Menunggu stabilitas node sesi...';
        area.innerHTML = '<div class="spinner"></div>';
        const start = Date.now();
        setTimeout(() => submitProof({ waited: Date.now() - start }), 3000);
      }

      if (step === 'slider') {
        title.innerText = '> VALIDASI_FISIK';
        desc.innerText = 'Geser tuas ke ujung kanan';
        area.innerHTML = `
          <div class="slider-track" id="track">
            <div class="slider-thumb" id="thumb">➔</div>
          </div>
        `;
        setupSlider();
      }
    }

    async function solvePoW(salt, difficulty) {
      const target = '0'.repeat(difficulty);
      let nonce = 0;
      while (true) {
        const msg = new TextEncoder().encode(salt + nonce);
        const buf = await crypto.subtle.digest('SHA-256', msg);
        const hash = Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
        if (hash.startsWith(target)) return nonce;
        nonce++;
      }
    }

    function setupSlider() {
      const thumb = document.getElementById('thumb');
      const track = document.getElementById('track');
      let isDragging = false, startX = 0, points = [];

      function start(e) { isDragging = true; startX = e.type.includes('touch') ? e.touches[0].clientX : e.clientX; }
      function move(e) {
        if (!isDragging) return;
        const currentX = e.type.includes('touch') ? e.touches[0].clientX : e.clientX;
        const delta = Math.max(0, Math.min(currentX - startX, track.clientWidth - 56));
        thumb.style.left = `${delta}px`;
        points.push({ x: currentX, t: Date.now() });

        if (delta >= track.clientWidth - 58) {
          isDragging = false;
          submitProof({ isTrusted: e.isTrusted, points });
        }
      }
      function end() { isDragging = false; thumb.style.left = '0px'; points = []; }

      thumb.addEventListener('mousedown', start); window.addEventListener('mousemove', move); window.addEventListener('mouseup', end);
      thumb.addEventListener('touchstart', start); window.addEventListener('touchmove', move); window.addEventListener('touchend', end);
    }

    init();
  </script>
</body>
</html>
