<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ZeroTrace Gateway</title>
  <style>
    :root {
      --bg: #090d16;
      --card: #111827;
      --border: #1f293d;
      --accent: #38bdf8;
      --text: #f3f4f6;
      --subtext: #9ca3af;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
    body { background: var(--bg); color: var(--text); display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; padding: 1.5rem; }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 2.5rem; width: 100%; max-width: 400px; box-shadow: 0 20px 40px rgba(0,0,0,0.4); text-align: center; }
    .spinner { border: 3px solid rgba(56, 189, 248, 0.15); border-top: 3px solid var(--accent); border-radius: 50%; width: 34px; height: 34px; animation: spin 0.9s linear infinite; margin: 1.5rem auto; }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    h2 { font-size: 1.3rem; margin-bottom: 0.35rem; font-weight: 700; }
    p { color: var(--subtext); font-size: 0.85rem; line-height: 1.4; }
    .slider-track { width: 100%; height: 48px; background: var(--bg); border: 1px solid var(--border); border-radius: 24px; position: relative; overflow: hidden; margin-top: 1.5rem; user-select: none; }
    .slider-thumb { width: 48px; height: 48px; background: var(--accent); border-radius: 50%; position: absolute; left: 0; top: 0; cursor: grab; display: flex; align-items: center; justify-content: center; color: #090d16; font-weight: bold; }
    footer { margin-top: 1.75rem; font-size: 0.75rem; color: var(--subtext); }
    footer span { color: var(--accent); font-weight: 600; }
  </style>
</head>
<body>
  <div class="card">
    <h2 id="stepTitle">Memverifikasi Integritas</h2>
    <p id="stepDesc">Menghubungkan ke perisai ZeroTrace...</p>
    <div id="contentArea"><div class="spinner"></div></div>
  </div>

  <footer>
    ZeroTrace Gateway &bull; Engineered by <span>noxm007</span>
  </footer>

  <script>
    const linkToken = window.location.pathname.split('/').pop();
    let currentSessionToken = null;

    async function init() {
      try {
        const res = await fetch('/api/init', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ linkToken })
        });
        const data = await res.json();
        if (data.error) throw new Error(data.error);

        currentSessionToken = data.sessionToken;
        handleStep(data.currentStep, data.stepData);
      } catch (err) {
        document.getElementById('stepTitle').innerText = 'Akses Ditolak';
        document.getElementById('stepDesc').innerText = err.message;
        document.getElementById('contentArea').innerHTML = '';
      }
    }

    async function submitProof(proof) {
      try {
        const res = await fetch('/api/verify', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ sessionToken: currentSessionToken, proof })
        });
        const data = await res.json();
        if (data.error) throw new Error(data.error);

        if (data.done) {
          document.getElementById('stepTitle').innerText = 'Verifikasi Selesai';
          document.getElementById('stepDesc').innerText = 'Mendekripsi tujuan aman...';
          document.getElementById('contentArea').innerHTML = '<div class="spinner"></div>';
          
          const resolveRes = await fetch('/api/resolve', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ readyToken: data.readyToken })
          });
          const resolveData = await resolveRes.json();
          if (resolveData.destination) {
            window.location.href = resolveData.destination;
          }
        } else {
          currentSessionToken = data.sessionToken;
          handleStep(data.nextStep, data.stepData);
        }
      } catch (err) {
        document.getElementById('stepTitle').innerText = 'Gagal';
        document.getElementById('stepDesc').innerText = err.message;
      }
    }

    function handleStep(step, stepData) {
      const title = document.getElementById('stepTitle');
      const desc = document.getElementById('stepDesc');
      const area = document.getElementById('contentArea');

      if (step === 'pow') {
        title.innerText = 'Bukti Komputasi (PoW)';
        desc.innerText = 'Menghitung hash latar belakang peramban...';
        area.innerHTML = '<div class="spinner"></div>';
        setTimeout(async () => {
          const nonce = await solvePoW(stepData.salt, stepData.difficulty);
          submitProof({ nonce });
        }, 80);
      }

      if (step === 'delay') {
        title.innerText = 'Sinkronisasi Buffer';
        desc.innerText = 'Menunggu stabilitas node sesi (3s)...';
        area.innerHTML = '<div class="spinner"></div>';
        const start = Date.now();
        setTimeout(() => {
          submitProof({ waited: Date.now() - start });
        }, 3000);
      }

      if (step === 'slider') {
        title.innerText = 'Tantangan Fisik Kursor';
        desc.innerText = 'Geser tombol ke kanan untuk membuka';
        area.innerHTML = `
          <div class="slider-track" id="track">
            <div class="slider-thumb" id="thumb">➔</div>
          </div>
        `;
        setupSlider();
      }
    }

    async function solvePoW(salt, difficulty) {
      const target = '0'.repeat(difficulty);
      let nonce = 0;
      while (true) {
        const msg = new TextEncoder().encode(salt + nonce);
        const buf = await crypto.subtle.digest('SHA-256', msg);
        const hash = Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
        if (hash.startsWith(target)) return nonce;
        nonce++;
      }
    }

    function setupSlider() {
      const thumb = document.getElementById('thumb');
      const track = document.getElementById('track');
      let isDragging = false;
      let startX = 0;
      let points = [];

      function start(e) {
        isDragging = true;
        startX = e.type.includes('touch') ? e.touches[0].clientX : e.clientX;
      }

      function move(e) {
        if (!isDragging) return;
        const currentX = e.type.includes('touch') ? e.touches[0].clientX : e.clientX;
        const delta = Math.max(0, Math.min(currentX - startX, track.clientWidth - 48));
        thumb.style.left = `${delta}px`;
        points.push({ x: currentX, t: Date.now() });

        if (delta >= track.clientWidth - 50) {
          isDragging = false;
          submitProof({ isTrusted: e.isTrusted, points });
        }
      }

      function end() {
        isDragging = false;
        thumb.style.left = '0px';
        points = [];
      }

      thumb.addEventListener('mousedown', start);
      window.addEventListener('mousemove', move);
      window.addEventListener('mouseup', end);
      thumb.addEventListener('touchstart', start);
      window.addEventListener('touchmove', move);
      window.addEventListener('touchend', end);
    }

    init();
  </script>
</body>
</html>
